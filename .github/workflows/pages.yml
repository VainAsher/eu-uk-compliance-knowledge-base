name: Publish (GitHub Pages)

# Manual-only while the repository is private (free-plan Pages needs a public
# repo). To go live: make the repo public, enable Pages (Settings → Pages →
# Source: GitHub Actions), then run this workflow — or change the trigger to
# `push: {branches: [main]}` for automatic publishing on every merge.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml mkdocs-material
      - name: Regenerate site scaffolding (nav + landing page)
        run: python scripts/build_site.py
      - name: Build site
        run: python -m mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
